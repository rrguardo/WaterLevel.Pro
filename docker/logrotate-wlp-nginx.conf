# Rotate the nginx access/error logs that live inside the Docker volume.
# Install on the host:
#   cp docker/logrotate-wlp-nginx.conf /etc/logrotate.d/wlp-nginx-logs
#   logrotate -d /etc/logrotate.d/wlp-nginx-logs     # dry-run
#
# copytruncate is used on purpose: no signal/restart of the container is needed
# (nginx opens these files with O_APPEND) and the GoAccess runner keeps working.
# The daily report jobs in ext_conf/crontab.ini depend on the *.1 files this
# creates (they skip silently while only the live log exists).
/var/lib/docker/volumes/docker_wlp_nginx_logs/_data/wlp_web_access.log
/var/lib/docker/volumes/docker_wlp_nginx_logs/_data/wlp_api_access.log
/var/lib/docker/volumes/docker_wlp_nginx_logs/_data/wlp_web_error.log
/var/lib/docker/volumes/docker_wlp_nginx_logs/_data/wlp_api_error.log
{
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su root root
}
